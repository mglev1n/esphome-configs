#-------------------------------------------
# LVGL pages and Buttons
#-------------------------------------------

# Wake screen on touch
touchscreen:
  on_touch:
    then:
      - logger.log: "LVGL is active"
      - lvgl.resume:
      - if:
      # Only turn on baclight and set to 50% if late_night_mode is on
          condition:
            - lambda: |-
                return id(late_night_mode);
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 50%
          else:
            - light.turn_on:
                id: display_backlight
                brightness: 100%

# Main LVGL section
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  on_idle: !include { file: modules/lvgl/lvgl_touchscreen_idle.yaml }

  theme: !include { file: modules/lvgl/lvgl_theme.yaml }
  page_wrap: true

# # Boot Screen
#   top_layer: !include { file: modules/lvgl/boot_screen.yaml }

  # Persistent navbar in top layer
  top_layer:
    widgets:
      - obj:
          align: bottom_mid
          scrollable: false
          bg_color: Black
          border_opa: TRANSP
          bg_opa: cover
          width: 100%
          height: 10%
          widgets:
            - !include modules/lvgl/navbar.yaml

# Main Page
  pages:
    - id: boot_page
      scrollable: false
      bg_color: Black
      border_opa: TRANSP
      bg_opa: cover
      widgets:
        - !include modules/lvgl/boot_page.yaml

    - id: main_page
      scrollable: false
      bg_color: Black
      border_opa: TRANSP
      bg_opa: cover
      pad_all: 5
      widgets:
      # button container
      - obj: # a properly placed container object for all these controls
          align: top_mid
          scrollable: false
          bg_color: Black
          border_opa: TRANSP
          bg_opa: cover
          width: 100%
          height: 90%
          layout: # enable the FLEX layout for the children widgets
            type: FLEX
            flex_flow: COLUMN_WRAP # the order of the widgets starts top left
            flex_align_cross: CENTER # they sould be centered
          widgets:
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 1, height: $button_height_double } }
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 2, height: $button_height_double } }
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 3, height: $button_height_double } }
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 4, height: $button_height_double } }
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 5, height: $button_height_single } }
            - button: !include { file: modules/lvgl/basic_switch_button.yaml, vars: { id: 6, height: $button_height_single } }
            - button: !include { file: modules/lvgl/basic_boolean_button.yaml, vars: { id: 7, height: $button_height_single } }
            - button: !include { file: modules/lvgl/basic_boolean_alert.yaml, vars: { id: 8, height: $button_height_single } }

    # Clock (disabled to save flash)
